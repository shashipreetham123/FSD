<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
            color: white;
        }

        body {
            padding: 10px;
            background-color: darkslateblue;
        }

        h1 {
            padding: 10px;
        }

        .search-box-container {
            max-width: 800px;
            margin: 20px auto;
            display: flex;
            overflow: hidden;
            border-radius: 3px;

        }

        .search-box-container:focus-within {
            box-shadow: 0 0 5px rgb(52, 51, 51);
        }

        .search-box-container input {
            flex-grow: 4;
            border: none;
            padding: 10px;
            outline: none;
            font-size: 18px;
            color: black;
        }

        .search-box-container button {
            flex-grow: 1;
            border: none;
            font-size: 18px;
            padding: 10px;
            background-color: rgb(248, 119, 119);
        }

        .search-box-container button:hover {
            background-color: rgb(255, 74, 74);
            cursor: pointer;
        }

        .current-weather,
        .forecast {
            border: 1px solid white;
            background-color: rgba(255, 255, 255, 0.096);
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            border-radius: 3px;
            display: flex;
            gap: 10px;
        }

        .location-time {
            font-size: 18px;
        }

        .location-time p:nth-child(1) {
            font-size: 24px;
        }

        .weather {
            margin: auto;
            font-size: 40px;
        }

        .weather-details {
            margin: auto;
        }

        #message {
            font-size: 20px;
            text-align: center;
        }

        .forecast {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .forecast-card {
            padding: 5px;
        }

        .forecast-card p {
            text-align: center;
            font-size: 12px;
        }

        .forecast .day {
            font-size: 14px;
        }

        .forecast .icon {
            font-size: 40px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {
            .forecast {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

            .current-weather {
                flex-direction: column;
            }

        }
    </style>
</head>

<body>
    <h1 align="center">Weather Forecast</h1>
    <div class="search-box-container">
        <input type="text" id="city-input" placeholder="Enter the City Name">
        <button onclick="getWeather()">Get</button>
    </div>
    <div id="message"></div>
    <div class="current-weather hidden">
        <div class="location-time"></div>
        <div class="weather"></div>
        <div class="weather-details"></div>
    </div>
    <h1 align="center" id="forecast-text" class="hidden">Forecast for Next 7 Days</h1>
    <div class="forecast hidden"></div>


    <script>
        const cityInput = document.getElementById("city-input")
        const locationTimeElt = document.querySelector(".location-time")
        const weatherElt = document.querySelector(".weather")
        const weatherDetElt = document.querySelector(".weather-details")
        const forecastElt = document.querySelector(".forecast")
        const messageElt = document.getElementById("message")
        const currentWeatherElt = document.querySelector(".current-weather")
        const forecastText = document.getElementById("forecast-text")
        const week = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]

        function getWeatherDescription(code) {
            const weatherCodes = {
                0: { text: "Clear Sky", icon: "☀️" },
                1: { text: "Mainly Clear", icon: "🌤️" },
                2: { text: "Partly Cloudy", icon: "⛅" },
                3: { text: "Overcast", icon: "☁️" },
                45: { text: "Fog", icon: "🌫️" },
                48: { text: "Depositing Rime Fog", icon: "🌫️" },
                51: { text: "Light Drizzle", icon: "🌦️" },
                53: { text: "Moderate Drizzle", icon: "🌦️" },
                55: { text: "Dense Drizzle", icon: "🌧️" },
                61: { text: "Slight Rain", icon: "🌦️" },
                63: { text: "Moderate Rain", icon: "🌧️" },
                65: { text: "Heavy Rain", icon: "🌧️" },
                71: { text: "Slight Snowfall", icon: "🌨️" },
                73: { text: "Moderate Snowfall", icon: "🌨️" },
                75: { text: "Heavy Snowfall", icon: "❄️" },
                80: { text: "Slight Rain Showers", icon: "🌦️" },
                81: { text: "Moderate Rain Showers", icon: "🌧️" },
                82: { text: "Violent Rain Showers", icon: "⛈️" },
                95: { text: "Thunderstorm", icon: "⛈️" }
            };

            return (
                weatherCodes[code] ||
                {
                    "text": "Unknown Weather",
                    "icon": "❓"
                }
            );
        }

        async function getWeather() {
            const city = cityInput.value
            currentWeatherElt.classList.add("hidden")
            forecastText.classList.add("hidden")
            forecastElt.classList.add("hidden")
            if (city == "") {
                messageElt.textContent = "Please Enter a City Name"
                return
            }

            const geoURL = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
            messageElt.textContent = "Loading Weather Data..."
            const response = await fetch(geoURL)

            if (!response.ok) {
                messageElt.textContent = "Unable to find City"
                return
            }

            const data = await response.json()

            if (!data.results || data.results.length == 0) {
                messageElt.textContent = "City not found"
                return
            }

            const location = {
                longitude: data.results[0].longitude,
                latitude: data.results[0].latitude,
                country: data.results[0].country,
                city: data.results[0].name,
                state: data.results[0].admin1
            }

            const weatherURL =
                `https://api.open-meteo.com/v1/forecast` +
                `?latitude=${location.latitude}` +
                `&longitude=${location.longitude}` +
                `&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code` +
                `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
                `&timezone=auto` +
                `&forecast_days=7`;

            const weatherResponse = await fetch(weatherURL)

            if (!weatherResponse.ok) {
                messageElt.textContent = "Unable to Load Weather Data"
                return
            }

            const weatherData = await weatherResponse.json()

            messageElt.textContent = ""

            displayWeather(location, weatherData)
        }

        function displayWeather(location, weatherData) {
            console.log(location)
            const date = new Date(weatherData.current.time)
            const day = week[date.getDay()]
            const time = date.toLocaleTimeString("en-US", {
                hour: "numeric",
                minute: "2-digit",
                hour12: true
            })

            const temperature = Math.round(weatherData.current.temperature_2m)
            const humidity = weatherData.current.relative_humidity_2m
            const windSpeed = weatherData.current.wind_speed_10m
            const weatherDesc = getWeatherDescription(weatherData.current.weather_code)

            locationTimeElt.innerHTML = `
        <p>${location.city}, ${location.state}, ${location.country}</p>
        <p>${day}, ${time}</p>
        <p>${weatherDesc.text}</p>
    `

            weatherElt.innerHTML = `<p>${weatherDesc.icon} ${temperature}°C</p>`

            weatherDetElt.innerHTML = `
        <p>Humidity: ${humidity}%</p>
        <p>Wind Speed: ${windSpeed}km/h</p>
    `
            currentWeatherElt.classList.remove("hidden")

            displayForecast(date.getDay(), weatherData.daily, 7)
        }

        function displayForecast(dayNo, daily, forecastDays) {
            forecastElt.innerHTML = ""
            for (let i = 0; i < forecastDays; i++) {
                const max = Math.round(daily.temperature_2m_max[i])
                const min = Math.round(daily.temperature_2m_min[i])
                const day = week[(dayNo + i + 1) % 7]
                const code = daily.weather_code[i]
                const desc = getWeatherDescription(code)

                forecastElt.innerHTML += `
            <div class="forecast-card">
                <p class="day">${day}</p>
                <p class="icon">${desc.icon}</p>
                <p>${desc.text}</p>
                <p>${max}°C ${min}°C</p>
            </div>
        `
            }
            forecastText.classList.remove("hidden")

            forecastElt.classList.remove("hidden")
        }

        currentWeatherElt.classList.add("hidden")
        forecastElt.classList.add("hidden")
        forecastText.classList.add("hidden")

    </script>


</body>

</html>
