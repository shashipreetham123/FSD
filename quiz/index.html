<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Javascript Quiz Application with Timer and Scoring Sysem using DOM</h1>
    <div class="quiz-container">
        <div id="question"></div>
        <div class="timer" hidden></div>
        <div class="options"></div>
        <button class="button" id="start-button" onclick="startQuiz()">Start Quiz</button>
        <button class="button" id="next-button" onclick="nextQuestion()" hidden>Next Question</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
